
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDIANA Simulator</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #111820;
  overflow: hidden;
}

.simulator {
  display: grid;
  grid-template-columns: 48% 52%;
  width: 100%;
  height: 100vh;
}

.device-area {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.device-area img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.workspace {
  border-left: 1px solid #34404c;
  background: #111820;
}
</style>
</head>
<body>
<main class="simulator">
  <section class="device-area">
  <img src="mediana-base.png" alt="Дефібрилятор MEDIANA">
  </section>
  <section class="workspace"></section>
</main>
</body>
</html>
